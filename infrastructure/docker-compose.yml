# =============================================================================
# Food Ordering System — Docker Compose
# =============================================================================
#
# Infrastructure choice notes
# ---------------------------
# * Kafka 7.6.1 (Confluent Platform) in KRaft mode (no ZooKeeper).
#   Port 2181 is NOT exposed since ZooKeeper is not used.
#   Reference docs: https://docs.confluent.io/platform/current/installation/docker/config-reference.html
#
# * Three Kafka brokers on host ports 19092, 29092, 39092 as specified.
#
# * Schema Registry  → 8081
# * Kafka Connect    → 8083  (Debezium connector pre-installed)
# * Kafka UI         → 9000  (provectuslabs/kafka-ui)
# * PostgreSQL       → 5432
#
# * Services run in Uvicorn inside their respective containers.
#   Connection retries are implemented in each application's startup.
#
# Usage
# -----
#   docker compose up --build
#   docker compose down -v   # remove volumes
#
# =============================================================================

version: "3.9"

x-kafka-common: &kafka-common
  image: confluentinc/cp-kafka:7.6.1
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
    interval: 15s
    timeout: 10s
    retries: 10
    start_period: 30s

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
  kafka1_data:
  kafka2_data:
  kafka3_data:

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  food_net:
    driver: bridge

# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:

  # --------------------------------------------------------------------------
  # PostgreSQL 16
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: food-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-food_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-food_pass}
      POSTGRES_DB: ${POSTGRES_DB:-food_ordering}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command: >
      postgres
        -c wal_level=logical
        -c max_replication_slots=10
        -c max_wal_senders=10
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-food_user} -d ${POSTGRES_DB:-food_ordering}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - food_net

  # --------------------------------------------------------------------------
  # Kafka broker 1 (KRaft controller + broker)
  # --------------------------------------------------------------------------
  kafka1:
    <<: *kafka-common
    container_name: food-kafka1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:29093,2@kafka2:29093,3@kafka3:29093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:19092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka1:9092,EXTERNAL://localhost:19092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "19092:19092"
    volumes:
      - kafka1_data:/var/lib/kafka/data
    networks:
      - food_net

  # --------------------------------------------------------------------------
  # Kafka broker 2
  # --------------------------------------------------------------------------
  kafka2:
    <<: *kafka-common
    container_name: food-kafka2
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:29093,2@kafka2:29093,3@kafka3:29093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka2:9092,EXTERNAL://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "29092:29092"
    volumes:
      - kafka2_data:/var/lib/kafka/data
    networks:
      - food_net

  # --------------------------------------------------------------------------
  # Kafka broker 3
  # --------------------------------------------------------------------------
  kafka3:
    <<: *kafka-common
    container_name: food-kafka3
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:29093,2@kafka2:29093,3@kafka3:29093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,EXTERNAL://0.0.0.0:39092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka3:9092,EXTERNAL://localhost:39092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "39092:39092"
    volumes:
      - kafka3_data:/var/lib/kafka/data
    networks:
      - food_net

  # --------------------------------------------------------------------------
  # Confluent Schema Registry
  # --------------------------------------------------------------------------
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: food-schema-registry
    restart: unless-stopped
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
      SCHEMA_REGISTRY_LISTENERS: "http://0.0.0.0:8081"
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 3
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8081/subjects || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - food_net

  # --------------------------------------------------------------------------
  # Kafka Connect with Debezium
  # --------------------------------------------------------------------------
  kafka-connect:
    image: debezium/connect:2.6
    container_name: food-kafka-connect
    restart: unless-stopped
    depends_on:
      schema-registry:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
      GROUP_ID: "food-connect-cluster"
      CONFIG_STORAGE_TOPIC: "food-connect-configs"
      OFFSET_STORAGE_TOPIC: "food-connect-offsets"
      STATUS_STORAGE_TOPIC: "food-connect-status"
      CONFIG_STORAGE_REPLICATION_FACTOR: 3
      OFFSET_STORAGE_REPLICATION_FACTOR: 3
      STATUS_STORAGE_REPLICATION_FACTOR: 3
      KEY_CONVERTER: "org.apache.kafka.connect.storage.StringConverter"
      VALUE_CONVERTER: "io.confluent.connect.avro.AvroConverter"
      VALUE_CONVERTER_SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
      CONNECT_SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - food_net

  # --------------------------------------------------------------------------
  # Kafka UI (management interface on port 9000)
  # --------------------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: food-kafka-ui
    restart: unless-stopped
    depends_on:
      - schema-registry
    environment:
      KAFKA_CLUSTERS_0_NAME: "food-ordering"
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: "http://schema-registry:8081"
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: "debezium"
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: "http://kafka-connect:8083"
    ports:
      - "9000:8080"
    networks:
      - food_net

  # --------------------------------------------------------------------------
  # Topic initializer (runs once, exits 0)
  # --------------------------------------------------------------------------
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    container_name: food-kafka-init
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: |
      "
      echo 'Waiting for Kafka to be ready...'
      cub kafka-ready -b kafka1:9092 3 60
      kafka-topics --bootstrap-server kafka1:9092 --create --if-not-exists --topic payment-request             --partitions 3 --replication-factor 3
      kafka-topics --bootstrap-server kafka1:9092 --create --if-not-exists --topic payment-response            --partitions 3 --replication-factor 3
      kafka-topics --bootstrap-server kafka1:9092 --create --if-not-exists --topic restaurant-approval-request --partitions 3 --replication-factor 3
      kafka-topics --bootstrap-server kafka1:9092 --create --if-not-exists --topic restaurant-approval-response --partitions 3 --replication-factor 3
      kafka-topics --bootstrap-server kafka1:9092 --create --if-not-exists --topic customer                    --partitions 3 --replication-factor 3
      echo 'Topics created.'
      "
    networks:
      - food_net

  # --------------------------------------------------------------------------
  # Order Service
  # --------------------------------------------------------------------------
  order-service:
    build:
      context: ../services/order_service
      dockerfile: Dockerfile
    container_name: food-order-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    env_file:
      - ../.env
    environment:
      SERVICE_NAME: "order-service"
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-food_user}:${POSTGRES_PASSWORD:-food_pass}@postgres:5432/${POSTGRES_DB:-food_ordering}"
      KAFKA_BOOTSTRAP_SERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
    ports:
      - "8181:8181"
    networks:
      - food_net

  # --------------------------------------------------------------------------
  # Payment Service
  # --------------------------------------------------------------------------
  payment-service:
    build:
      context: ../services/payment_service
      dockerfile: Dockerfile
    container_name: food-payment-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    env_file:
      - ../.env
    environment:
      SERVICE_NAME: "payment-service"
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-food_user}:${POSTGRES_PASSWORD:-food_pass}@postgres:5432/${POSTGRES_DB:-food_ordering}"
      KAFKA_BOOTSTRAP_SERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
    ports:
      - "8182:8182"
    networks:
      - food_net

  # --------------------------------------------------------------------------
  # Restaurant Service
  # --------------------------------------------------------------------------
  restaurant-service:
    build:
      context: ../services/restaurant_service
      dockerfile: Dockerfile
    container_name: food-restaurant-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    env_file:
      - ../.env
    environment:
      SERVICE_NAME: "restaurant-service"
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-food_user}:${POSTGRES_PASSWORD:-food_pass}@postgres:5432/${POSTGRES_DB:-food_ordering}"
      KAFKA_BOOTSTRAP_SERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
    ports:
      - "8183:8183"
    networks:
      - food_net

  # --------------------------------------------------------------------------
  # Customer Service
  # --------------------------------------------------------------------------
  customer-service:
    build:
      context: ../services/customer_service
      dockerfile: Dockerfile
    container_name: food-customer-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    env_file:
      - ../.env
    environment:
      SERVICE_NAME: "customer-service"
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-food_user}:${POSTGRES_PASSWORD:-food_pass}@postgres:5432/${POSTGRES_DB:-food_ordering}"
      KAFKA_BOOTSTRAP_SERVERS: "kafka1:9092,kafka2:9092,kafka3:9092"
      SCHEMA_REGISTRY_URL: "http://schema-registry:8081"
    ports:
      - "8184:8184"
    networks:
      - food_net
