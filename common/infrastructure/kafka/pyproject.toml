[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "kafka-infrastructure"
version = "1.0.0"
description = "Shared Kafka and Avro infrastructure for food-ordering microservices"
requires-python = ">=3.10"
dependencies = [
    "confluent-kafka>=2.4.0",
    "fastavro>=1.9.0",
    "authlib>=1.3.0",
    "certifi>=2024.2.2",
    "httpx>=0.27.0",
    "cachetools>=5.3.0",

]

[tool.setuptools.packages.find]
where = ["src"]
